[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinpilot"
version = "0.1.0"
description = "Leakage-aware AI crypto trading research and paper-trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "requests>=2.31,<3",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
coinpilot = "coinpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
